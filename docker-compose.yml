version: '3.8'

services:
  app:
    build: ./backend
    image: khalilbelouahchia_4fintech4_appgestiondesprojets:latest
    container_name: khalilbelouahchia_4fintech4_appgestiondesprojets
    ports:
      - "8085:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
